<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signage</title>
<!--
  Chrome Sign Builder replacement.

  You should not need to edit this file. All content lives in config.js.

  Each kiosk points at this page with its display ID:
    https://bshcrepo.github.io/signage/?id=bccb-breakroom

  The page looks up that display's schedule, picks the content for today's day
  of month (and, where a schedule defines meal times, for the current time of
  day), and rolls over on its own. Source decks in Drive are never modified
  and stay shared with any other displays that use them.

  Screen rotation is handled here rather than by device policy, because
  ChromeOS removed the kiosk screen rotation setting along with Chrome App
  kiosk support. Set "rotate" per display in config.js.
-->
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #000;
    overflow: hidden;
  }

  #stage {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
  }

  #stage iframe,
  #stage img {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* Menu images are whole designed pages, so show the entire thing rather
     than cropping it. Any leftover edge stays black. */
  #stage img {
    object-fit: contain;
    background: #000;
  }

  /* Upright. */
  #stage.rot-0 {
    width: 100vw;
    height: 100vh;
  }

  /* Quarter turn clockwise. Width and height swap. */
  #stage.rot-90 {
    width: 100vh;
    height: 100vw;
    transform: rotate(90deg) translate(0, -100%);
  }

  /* Upside down. */
  #stage.rot-180 {
    width: 100vw;
    height: 100vh;
    transform: rotate(180deg) translate(-100%, -100%);
  }

  /* Quarter turn counter-clockwise. Width and height swap. */
  #stage.rot-270 {
    width: 100vh;
    height: 100vw;
    transform: rotate(-90deg) translate(-100%, 0);
  }

  #message {
    display: none;
    position: absolute;
    inset: 0;
    color: #888;
    background: #000;
    font: 20px/1.5 system-ui, sans-serif;
    text-align: center;
    align-items: center;
    justify-content: center;
    padding: 40px;
    box-sizing: border-box;
    z-index: 10;
  }
</style>
</head>
<body>

<div id="stage" class="rot-0">
  <iframe id="deck" allowfullscreen title="Signage content"></iframe>
  <img id="pic" alt="" style="display:none">
</div>
<div id="message"></div>

<script src="config.js"></script>
<script>
(function () {
  'use strict';

  var VALID_ROTATIONS = [0, 90, 180, 270];

  var stage = document.getElementById('stage');
  var frame = document.getElementById('deck');
  var pic = document.getElementById('pic');
  var message = document.getElementById('message');
  var currentKey = null;

  function fail(text) {
    stage.style.display = 'none';
    message.style.display = 'flex';
    message.textContent = text;
  }

  function displayId() {
    var match = /[?&]id=([^&]+)/.exec(window.location.search);
    return match ? decodeURIComponent(match[1]) : DEFAULT_DISPLAY;
  }

  /**
   * For a schedule with meal times, returns whichever meal is current.
   *
   * Meals are listed in config.js in clock order, each with a "from" time in
   * 24-hour HH:MM. A meal shows from its own "from" until the next one starts.
   * The last meal of the day carries through midnight until the first one
   * begins, so an overnight screen keeps showing dinner rather than going
   * blank.
   *
   * Returns null for schedules that have no meal times, which is most of them.
   */
  function activeMeal(schedule) {
    if (!schedule.meals || !schedule.meals.length) return null;

    var now = new Date();
    var minutesNow = now.getHours() * 60 + now.getMinutes();

    // Default to the last meal, which covers the overnight window.
    var chosen = schedule.meals[schedule.meals.length - 1];

    for (var i = 0; i < schedule.meals.length; i++) {
      var meal = schedule.meals[i];
      var parts = String(meal.from || '00:00').split(':');
      var startMinutes = (parseInt(parts[0], 10) || 0) * 60 +
                         (parseInt(parts[1], 10) || 0);
      if (minutesNow >= startMinutes) chosen = meal;
    }

    return chosen;
  }

  /**
   * Flattens a schedule down to the one set of content to show right now.
   * For a meal-based schedule that is the current meal's content; for every
   * other schedule it is the schedule itself, unchanged.
   */
  function resolveSchedule(schedule) {
    var meal = activeMeal(schedule);
    if (!meal) return schedule;

    return {
      hold:       (meal.hold !== undefined) ? meal.hold : schedule.hold,
      delayMs:    meal.delayMs || schedule.delayMs,
      deck:       meal.deck,
      slides:     meal.slides,
      slideCount: meal.slideCount,
      static:     meal.static,
      decks:      meal.decks,
      images:     meal.images,
      ext:        meal.ext || schedule.ext
    };
  }

  function pad2(n) {
    return (n < 10 ? '0' : '') + n;
  }

  function embedUrl(schedule, day) {
    var base = 'https://docs.google.com/presentation/d/e/';

    // A folder of image files, one per day of month, named 01..31 plus an
    // extension. Nothing to list in config.js — the filename IS the schedule.
    // Paths are relative to this page, so "menus/avah/lunch/" resolves to
    // https://YOURORG.github.io/signage/menus/avah/lunch/05.png
    if (schedule.images) {
      var dir = schedule.images;
      if (dir.charAt(dir.length - 1) !== '/') dir += '/';
      return 'image:' + dir + pad2(day) + '.' + (schedule.ext || 'png');
    }

    // One deck, a specific slide per day, held static.
    //
    // Must use /embed. Google sends X-Frame-Options on /pub, so /pub cannot be
    // iframed at all — it fails with "refused to connect". Sign Builder loaded
    // /pub directly rather than in a frame, which is why the URLs in the old
    // Sign Builder config cannot be reused verbatim here.
    //
    // Two ways to name the slide:
    //   slideCount  slide POSITION is the day of month. Preferred.
    //   slides[]    each day names its slide by object ID. Use when the
    //               slides are not in day order.
    if (schedule.deck && (schedule.slides || schedule.slideCount)) {
      var anchor;

      if (schedule.slideCount) {
        var pos = (day <= schedule.slideCount) ? day : schedule.slideCount;
        anchor = 'p' + pos;
      } else {
        anchor = schedule.slides[day] || schedule.slides[1];
      }

      if (!anchor) return null;
      return base + schedule.deck +
             '/embed?start=false&loop=false&delayms=60000' +
             '#slide=id.' + anchor;
    }

    // One deck looping all day, or a different deck each day.
    var deckId = schedule.static ||
                 (schedule.decks && (schedule.decks[day] || schedule.decks[1]));
    if (!deckId) return null;

    if (schedule.hold) {
      return base + deckId + '/embed?start=false&loop=false&delayms=60000';
    }

    return base + deckId +
           '/embed?start=true&loop=true&delayms=' + (schedule.delayMs || 10000);
  }

  function applyRotation(degrees) {
    var deg = VALID_ROTATIONS.indexOf(degrees) !== -1 ? degrees : 0;
    stage.className = 'rot-' + deg;
  }

  function render() {
    var id = displayId();
    var display = DISPLAYS[id];

    if (!display) {
      fail('Unknown display ID: "' + id + '". Check config.js.');
      return;
    }

    var schedule = SCHEDULES[display.schedule];

    if (!schedule) {
      fail('Display "' + id + '" points at missing schedule "' +
           display.schedule + '". Check config.js.');
      return;
    }

    var day = new Date().getDate();
    var url = embedUrl(resolveSchedule(schedule), day);

    if (!url) {
      fail('No content configured for day ' + day + ' of "' +
           display.schedule + '".');
      return;
    }

    // Only touch the iframe when the target actually changes, so the
    // slideshow is not restarted every time this runs.
    var key = id + '|' + url + '|' + display.rotate;
    if (key === currentKey) return;
    currentKey = key;

    message.style.display = 'none';
    stage.style.display = 'block';
    applyRotation(display.rotate || 0);

    if (url.indexOf('image:') === 0) {
      var src = url.slice(6);
      frame.style.display = 'none';
      frame.src = 'about:blank';
      pic.style.display = 'block';
      pic.onerror = function () {
        fail('No menu image found for day ' + day + ' at "' + src + '".');
      };
      pic.src = src;
    } else {
      pic.style.display = 'none';
      pic.removeAttribute('src');
      frame.style.display = 'block';
      frame.src = url;
    }
  }

  render();

  // Runs every minute. Rolls the day over at midnight and switches between
  // breakfast, lunch and dinner at their configured times, with no reboot.
  setInterval(render, 60000);

  // Hard reload at 3:05am to clear any stale Slides cache and pick up
  // config.js changes without anyone touching the device.
  setInterval(function () {
    var now = new Date();
    if (now.getHours() === 3 && now.getMinutes() === 5) {
      window.location.reload(true);
    }
  }, 60000);
})();
</script>

</body>
</html>
