<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signage</title>
<!--
  Chrome Sign Builder replacement.

  You should not need to edit this file. All content lives in config.js.

  Each kiosk points at this page with its display ID:
    https://YOURORG.github.io/signage/?id=bldg-a-dining

  The page looks up that display's schedule, picks the deck for today's day
  of month, and rolls over on its own at midnight. Source decks in Drive are
  never modified and stay shared with any other displays that use them.

  Screen rotation is handled here rather than by device policy, because
  ChromeOS removed the kiosk screen rotation setting along with Chrome App
  kiosk support. Set "rotate" per display in config.js.
-->
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #000;
    overflow: hidden;
  }

  #stage {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
  }

  #stage iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* Upright. */
  #stage.rot-0 {
    width: 100vw;
    height: 100vh;
  }

  /* Quarter turn clockwise. Width and height swap. */
  #stage.rot-90 {
    width: 100vh;
    height: 100vw;
    transform: rotate(90deg) translate(0, -100%);
  }

  /* Upside down. */
  #stage.rot-180 {
    width: 100vw;
    height: 100vh;
    transform: rotate(180deg) translate(-100%, -100%);
  }

  /* Quarter turn counter-clockwise. Width and height swap. */
  #stage.rot-270 {
    width: 100vh;
    height: 100vw;
    transform: rotate(-90deg) translate(-100%, 0);
  }

  #message {
    display: none;
    position: absolute;
    inset: 0;
    color: #888;
    background: #000;
    font: 20px/1.5 system-ui, sans-serif;
    text-align: center;
    align-items: center;
    justify-content: center;
    padding: 40px;
    box-sizing: border-box;
    z-index: 10;
  }
</style>
</head>
<body>

<div id="stage" class="rot-0">
  <iframe id="deck" allowfullscreen title="Signage content"></iframe>
</div>
<div id="message"></div>

<script src="config.js"></script>
<script>
(function () {
  'use strict';

  var VALID_ROTATIONS = [0, 90, 180, 270];

  var stage = document.getElementById('stage');
  var frame = document.getElementById('deck');
  var message = document.getElementById('message');
  var currentKey = null;

  function fail(text) {
    stage.style.display = 'none';
    message.style.display = 'flex';
    message.textContent = text;
  }

  function displayId() {
    var match = /[?&]id=([^&]+)/.exec(window.location.search);
    return match ? decodeURIComponent(match[1]) : DEFAULT_DISPLAY;
  }

  function embedUrl(schedule, day) {
    var base = 'https://docs.google.com/presentation/d/e/';

    // Type 3: one deck, a specific slide per day, held static.
    // Slide is passed both as a query parameter and as a hash fragment.
    // Sign Builder used the query form, which is what worked reliably here;
    // the hash is a harmless fallback for viewer versions that prefer it.
    if (schedule.deck && schedule.slides) {
      var slideId = schedule.slides[day] || schedule.slides[1];
      if (!slideId) return null;
      return base + schedule.deck +
             '/pub?start=false&loop=false&delayms=86400000' +
             '&slide=id.' + slideId +
             '#slide=id.' + slideId;
    }

    // Type 2: one deck, looping all day, every day.
    // Type 1: a different deck each day.
    var deckId = schedule.static || (schedule.decks && (schedule.decks[day] || schedule.decks[1]));
    if (!deckId) return null;

    if (schedule.hold) {
      return base + deckId + '/embed?start=false&loop=false&delayms=60000';
    }

    return base + deckId +
           '/embed?start=true&loop=true&delayms=' + (schedule.delayMs || 10000);
  }

  function applyRotation(degrees) {
    var deg = VALID_ROTATIONS.indexOf(degrees) !== -1 ? degrees : 0;
    stage.className = 'rot-' + deg;
  }

  function render() {
    var id = displayId();
    var display = DISPLAYS[id];

    if (!display) {
      fail('Unknown display ID: "' + id + '". Check config.js.');
      return;
    }

    var schedule = SCHEDULES[display.schedule];

    if (!schedule) {
      fail('Display "' + id + '" points at missing schedule "' +
           display.schedule + '". Check config.js.');
      return;
    }

    var day = new Date().getDate();
    var url = embedUrl(schedule, day);

    if (!url) {
      fail('No content configured for day ' + day + ' of "' +
           display.schedule + '".');
      return;
    }

    // Only touch the iframe when the target actually changes, so the
    // slideshow is not restarted every time this runs.
    var key = id + '|' + url + '|' + display.rotate;
    if (key === currentKey) return;
    currentKey = key;

    message.style.display = 'none';
    stage.style.display = 'block';
    applyRotation(display.rotate || 0);
    frame.src = url;
  }

  render();

  // Rolls the day over at midnight without needing a reboot.
  setInterval(render, 60000);

  // Hard reload at 3:05am to clear any stale Slides cache and pick up
  // config.js changes without anyone touching the device.
  setInterval(function () {
    var now = new Date();
    if (now.getHours() === 3 && now.getMinutes() === 5) {
      window.location.reload(true);
    }
  }, 60000);
})();
</script>

</body>
</html>
